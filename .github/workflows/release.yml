name: Release

# Builds the RomM Windows installer and publishes it as a GitHub release.
# The newest release is always at https://github.com/itsdinkd/RomStop/releases/latest/download/<file>,
# which the README links to.
on:
  push:
    branches: [main]
    paths: ["romm/windows/**", "romm/ROMM_VERSION", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  romm-installer:
    uses: ./.github/workflows/romm-installer.yml

  release:
    needs: [romm-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: romm-installer
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" out/RomM-RomStop-Setup.exe \
            --target "$GITHUB_SHA" --title "RomStop $tag" --latest \
            --notes "RomM Windows installer, built from ${GITHUB_SHA::7}. The RomM image is ghcr.io/itsdinkd/romstop-romm:latest."

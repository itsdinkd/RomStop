name: Device tool

# Tests the ES-DE / Knulli tool on Linux and Windows and builds the standalone Windows romstop.exe.
on:
  pull_request:
    paths: ["device/**", ".github/workflows/device.yml"]
  workflow_call:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0
      - run: python -m unittest discover device

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.11.1
      - run: pyinstaller --onefile --name romstop --distpath out device/romstop.py
      - name: Smoke test setup against a local hack list
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP smoke
          New-Item -ItemType Directory -Force "$t/site/device", "$t/ES-DE/settings", "$t/ROMs/snes" | Out-Null
          '{"format":1,"consoles":{"snes":{"short":"SNES","extensions":[".sfc"]}},"hacks":[{"id":"x","title":"Smoke Hack","console":"snes","baseGame":"Game","authors":["A"],"type":"Complete","summary":"s","description":"d","page":"hack/x","links":[],"patches":[]}]}' | Set-Content "$t/site/device/index.json"
          "<string name=`"ROMDirectory`" value=`"$t/ROMs`" />" | Set-Content "$t/ES-DE/settings/es_settings.xml"
          $site = ([System.Uri]"$t/site/").AbsoluteUri
          ./out/romstop.exe --data-dir "$t/data" setup --esde-home "$t/ES-DE" --site $site
          if ($LASTEXITCODE) { exit 1 }
          Get-Content "$t/ES-DE/custom_systems/es_systems.xml"
          if (-not (Select-String -Quiet "romstop.exe`" install %ROM%" "$t/ES-DE/custom_systems/es_systems.xml")) { exit 1 }
          if (-not (Test-Path "$t/ROMs/romstop/SNES/Smoke Hack.romstop")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: romstop-exe
          path: out/romstop.exe
